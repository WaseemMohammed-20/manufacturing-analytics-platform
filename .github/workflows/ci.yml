name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile and test
        working-directory: backend
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: manufacturing
      POSTGRES_USER: manufacturing
      POSTGRES_PASSWORD: compose-validation-only
      SUPERSET_SECRET_KEY: compose-validation-only
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: compose-validation-only
      SUPERSET_ADMIN_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
